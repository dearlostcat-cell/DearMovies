id: cloudbridge
version: '1'
hosts:
- cloud.unblockedgames.world
- tech.unblockedgames.world
- technews.unblockedgames.world
path_pattern: .*
allowed_hosts:
- links.modpro.blog
- episodes.modpro.blog
- leechpro.blog
- cloud.unblockedgames.world
- driveseed.org
- driveleech.org
- cdn.video-gen.xyz
- video-seed.dev
- '*.workers.dev'
- '*.googleusercontent.com'
- tech.unblockedgames.world
- technews.unblockedgames.world
mode: links
request:
  timeout: 20
  retries: 2
  transport: http
  headers: {}
  wait_selector: null
  max_redirects: 8
link_selectors:
- a[href*="driveseed.org/"]
- a[href*="driveleech.org/"]
- a#two_steps_btn[href]
- span.block > a[href]
literal_url_patterns:
- (?:location(?:\.href)?|url)\s*=\s*["\x27](https?://(?:driveseed\.org|driveleech\.org)/[^"\x27]+)
- (https://(?:cloud|tech|technews)\.unblockedgames\.world/\?go=pepe-[\w-]+)
query_url_parameters: []
steps: []
max_steps: 20
max_hops: 16
fallback_on:
- TIMEOUT
- UNAVAILABLE
- INVALID_RESPONSE
- UNSUPPORTED
- LINK_EXPIRED
- ROUTE_REVISITED
- REDIRECT_LOOP
