id: modpro
version: '1'
hosts:
- links.modpro.blog
- episodes.modpro.blog
- leechpro.blog
path_pattern: .*
allowed_hosts:
- links.modpro.blog
- episodes.modpro.blog
- leechpro.blog
- cloud.unblockedgames.world
- driveseed.org
- driveleech.org
- cdn.video-gen.xyz
- video-seed.dev
- '*.workers.dev'
- '*.googleusercontent.com'
- tech.unblockedgames.world
- technews.unblockedgames.world
mode: links
request:
  timeout: 20
  retries: 2
  transport: http
  headers: {}
  wait_selector: null
  max_redirects: 8
link_selectors:
- a[href*="cloud.unblockedgames.world/"]
- a[href*="driveseed.org/"]
literal_url_patterns: []
query_url_parameters: []
steps: []
max_steps: 20
max_hops: 16
fallback_on:
- TIMEOUT
- UNAVAILABLE
- INVALID_RESPONSE
- UNSUPPORTED
- LINK_EXPIRED
- ROUTE_REVISITED
- REDIRECT_LOOP
