id: nexdrive
version: '1'
hosts:
- nexdrive.fit
allowed_hosts:
- nexdrive.fit
- fastdl.zip
- vcloud.fit
- video-downloads.googleusercontent.com
- '*.r2.dev'
- pixeldrain.dev
mode: links
query_url_parameters: []
request:
  timeout: 20
  retries: 1
  transport: http
link_selectors:
- a[href*="fastdl.zip/"]
- a[href*="vcloud.fit/"]
literal_url_patterns: []
path_pattern: .*
steps: []
